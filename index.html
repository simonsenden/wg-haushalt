<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F1">
<title>WG-Haushalt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --glass:rgba(255,255,255,.68); --glass-line:rgba(255,255,255,.75); --glass-hi:rgba(255,255,255,.9); --glass-on:rgba(47,125,107,.12);
  --bg:#FBF7F1; --surface:#FFFFFF; --surface-2:#F4EEE5; --line:#E8E0D4;
  --text:#2B2622; --muted:#7A7066; --accent:#2F7D6B; --accent-ink:#fff;
  --soon:#E9A23B; --soon-bg:#FDF2DF; --over:#E0614B; --over-bg:#FCE7E2; --ok:#3E9C72;
  --shadow:0 1px 2px rgba(60,40,20,.06),0 4px 14px rgba(60,40,20,.06);
  --radius:18px;
}
[data-theme="dark"]{
  --glass:rgba(42,45,51,.62); --glass-line:rgba(255,255,255,.10); --glass-hi:rgba(255,255,255,.08); --glass-on:rgba(92,194,167,.16);
  --bg:#17181B; --surface:#212328; --surface-2:#2A2D33; --line:#34373E;
  --text:#F1EEE9; --muted:#A39D95; --accent:#5CC2A7; --accent-ink:#0F1F1A;
  --soon:#F0B357; --soon-bg:#3A2F1E; --over:#F2806B; --over-bg:#3D2420; --ok:#62C394;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(110px + env(safe-area-inset-bottom))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.hello{font-size:22px;font-weight:900;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;font-weight:600}
.me-chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 6px;font-weight:800;box-shadow:var(--shadow);min-height:44px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:15px;flex:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.h2{font-size:18px;font-weight:900;margin:22px 2px 10px}
.h3{font-size:15px;font-weight:800;margin:0 0 8px}
.muted{color:var(--muted)}
.banner{border-radius:14px;padding:10px 14px;font-size:14px;font-weight:700;margin-bottom:12px;background:var(--soon-bg);color:var(--text);border:1px solid var(--line)}
/* suggestion */
.next{position:relative;overflow:hidden}
.next .label{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.next .who{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;margin:6px 0 10px}
.next .stripe{position:absolute;left:0;top:0;bottom:0;width:6px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:14px;padding:10px 12px;font-weight:800;text-align:left;min-height:48px}
.sugg button small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.sugg button[disabled]{cursor:default}
.weekbar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--surface-2);margin-top:12px}
.weekbar span{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;font-weight:700;color:var(--muted);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* tiles */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px 12px;text-align:left;box-shadow:var(--shadow);min-height:132px;display:flex;flex-direction:column;gap:6px;transition:transform .08s ease}
.tile:active{transform:scale(.97)}
.tile .ic{line-height:1}
.tile .nm{font-weight:800;font-size:15px;line-height:1.25}
.tile .pts{position:absolute;top:10px;right:10px;background:var(--surface-2);border-radius:99px;padding:2px 9px;font-size:13px;font-weight:900}
.tile .last{margin-top:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
.tile.soon{border-color:var(--soon);background:linear-gradient(0deg,var(--soon-bg),var(--surface) 70%)}
.tile.over{border-color:var(--over);background:var(--over-bg)}
.tile .badge{font-size:11.5px;font-weight:900;border-radius:99px;padding:2px 8px;align-self:flex-start}
.tile.soon .badge{background:var(--soon);color:#2b1d05}
.tile.over .badge{background:var(--over);color:#fff}
.tile[disabled]{opacity:.55}
/* segmented */
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px;margin-bottom:12px}
.seg button{flex:1 1 auto;border-radius:10px;padding:10px 4px;font-weight:800;color:var(--muted);min-height:44px;white-space:nowrap;font-size:clamp(13px,3.8vw,16px)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
/* bars */
.bar-row{margin:14px 0}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;margin-bottom:6px;gap:8px}
.bar-head .pct{font-size:20px;font-weight:900}
.bar{position:relative;height:22px;background:var(--surface-2);border-radius:99px;overflow:visible}
.bar .fill{height:100%;border-radius:99px;min-width:4px;transition:width .4s ease}
.bar .target{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text);opacity:.35;border-radius:2px}
.bar-note{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:4px}
.mini-table{width:100%;border-collapse:collapse;font-size:14px}
.mini-table td,.mini-table th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:center}
.mini-table td:first-child,.mini-table th:first-child{text-align:left}
.mini-table th{font-size:12px;color:var(--muted);font-weight:800}
/* history */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:800;white-space:nowrap;min-height:42px;display:flex;align-items:center}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.day{font-size:13px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 6px}
.item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.item .ic{font-size:24px;width:32px;text-align:center}
.item .body{flex:1;min-width:0}
.item .t{font-weight:800}
.item .m{font-size:13px;color:var(--muted);font-weight:700}
.item .p{font-weight:900}
.del{min-width:44px;min-height:44px;border-radius:12px;color:var(--muted);font-size:18px;display:grid;place-items:center}
.del.confirm{background:var(--over);color:#fff;font-size:13px;font-weight:900;padding:0 10px}
/* forms */
label.f{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:10px 0 4px}
.in{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:11px 12px;min-height:46px;outline:none}
.in:focus{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.btn{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 18px;font-weight:900;min-height:48px}
.btn.ghost{background:var(--surface-2);color:var(--text)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.5}
.task-edit{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.task-edit:last-of-type{border-bottom:0}
.task-edit .icon-in{text-align:center;font-size:22px;padding:6px}
.task-edit .nums{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.task-edit .nums label{flex:1;font-size:12px;font-weight:800;color:var(--muted)}
.task-edit .nums .in{margin-top:3px}
.person-edit{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.person-edit input[type=color]{width:52px;height:46px;border:0;padding:0;background:none;border-radius:12px}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0}
/* who picker */
.picker{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.picker h1{font-size:28px;font-weight:900;margin:0}
.picker .opts{display:grid;gap:12px;margin-top:10px}
.picker .opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;background:var(--surface);border:2px solid var(--line);font-size:20px;font-weight:900;min-height:72px;box-shadow:var(--shadow)}
.picker .opt .avatar{width:44px;height:44px;font-size:20px}
/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;z-index:20;pointer-events:none;padding:0 12px}
nav.tabs .in-nav{pointer-events:auto;display:flex;max-width:520px;width:100%;padding:6px;border-radius:28px;background:var(--glass);border:1px solid var(--glass-line);box-shadow:0 10px 30px rgba(40,25,10,.16),inset 0 1px 0 var(--glass-hi);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;font-size:11px;font-weight:800;color:var(--muted);min-height:54px;border-radius:22px;transition:background .2s,color .2s}
nav.tabs button .i{width:24px;height:24px;display:block}
nav.tabs button.on{color:var(--accent);background:var(--glass-on)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){nav.tabs .in-nav{background:var(--surface)}}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;width:min(560px,calc(100% - 24px));background:var(--text);color:var(--bg);border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;font-weight:900;transition:all .2s ease;z-index:30;overflow:hidden}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast .msg{flex:1}
.toast button{background:rgba(127,127,127,.25);color:inherit;border-radius:10px;padding:8px 12px;font-weight:900;min-height:40px}
.toast .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.tile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.hint{font-size:12.5px;color:var(--muted);font-weight:700;margin:-4px 2px 10px}
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .15s}
.sheet-wrap.show{opacity:1;pointer-events:auto}
.sheet{background:var(--surface);width:min(640px,100%);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -6px 30px rgba(0,0,0,.2);transform:translateY(30px);transition:transform .18s ease;max-height:90vh;overflow:auto}
.sheet-wrap.show .sheet{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet .title{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;margin-bottom:4px}
.sheet .actions{display:flex;gap:8px;margin-top:16px}
.sheet .actions .btn{flex:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;width:100vw;height:100vh}
.float-pts{position:fixed;z-index:51;pointer-events:none;font-weight:900;font-size:28px;transform:translate(-50%,-50%);animation:floatUp 1.1s ease-out forwards;text-shadow:0 2px 8px rgba(0,0,0,.18)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.tile.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.92)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.toast.show .msg{animation:toastIn .35s cubic-bezier(.3,1.6,.6,1)}
@keyframes toastIn{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.float-pts,.tile.pop,.toast.show .msg{animation:none}}
nav.tabs button{position:relative}
.nb{position:absolute;top:6px;left:calc(50% + 6px);background:var(--over);color:#fff;border-radius:99px;font-size:11px;font-weight:900;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
.shop-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 10px;margin-bottom:8px}
.shop-item .chk{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:20px;font-weight:900;color:transparent;background:var(--surface)}
.shop-item .chk:active{transform:scale(.92)}
.shop-item.done .chk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.shop-item.done .t{text-decoration:line-through;color:var(--muted)}
.shop-item .body{flex:1;min-width:0}
.shop-item .t{font-weight:800;font-size:16px;word-break:break-word}
.shop-item .m{font-size:12.5px;color:var(--muted);font-weight:700}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick .chip{font-size:14px;min-height:40px}
.rx{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.rx .got{background:var(--surface-2);border-radius:99px;padding:3px 9px;font-size:12.5px;font-weight:800}
.rx button{min-width:40px;min-height:36px;border-radius:99px;border:1.5px solid var(--line);font-size:16px;padding:0 10px;background:var(--surface)}
.rx button.on{border-color:var(--accent);background:var(--surface-2)}
.thanks-card{border-color:#FF9DB5;background:linear-gradient(135deg,rgba(255,122,162,.12),var(--surface) 70%)}
.thanks-card ul{margin:6px 0 0;padding:0;list-style:none}
.thanks-card li{font-weight:700;padding:3px 0}
.ico{display:inline-grid;place-items:center;flex:none;border-radius:14px;width:44px;height:44px;background:var(--surface-2);color:var(--text)}
.ico svg{width:60%;height:60%;display:block}
.ico.pic{background:none}
.ico.pic svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.12))}
.tile .ico{width:54px;height:54px}
.ico.sm.pic{width:38px;height:38px}
.ico.xs.pic{width:24px;height:24px}
.ico.sm{width:34px;height:34px;border-radius:11px}
.ico.xs{width:24px;height:24px;border-radius:7px;vertical-align:middle;margin-right:4px}
.ico.emo{font-size:22px}
.ico.sm.emo{font-size:18px}.ico.xs.emo{font-size:14px}
.tile{perspective:800px}
.tile .face{position:absolute;inset:-1px;border-radius:var(--radius);display:grid;place-items:center;opacity:0;pointer-events:none;color:#fff;backface-visibility:hidden}
.tile .face svg{width:56px;height:56px}
.tile .face svg path{stroke-dasharray:30;stroke-dashoffset:30}
.tile.flip{animation:flipY .7s cubic-bezier(.4,.1,.3,1) forwards}
.tile.flip .face{animation:faceIn .7s steps(1,end) forwards}
.tile.flip .face svg path{animation:drawCheck .35s .38s ease-out forwards}
@keyframes flipY{0%{transform:rotateY(0)}45%{transform:rotateY(90deg)}55%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
@keyframes faceIn{0%{opacity:0}50%{opacity:1}100%{opacity:1}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.tile.flip{animation:none}.tile.flip .face{animation:none;opacity:1}.tile.flip .face svg path{animation:none;stroke-dashoffset:0}}
.icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:12px}
.icon-grid button{display:grid;place-items:center;aspect-ratio:1;border-radius:18px;background:none;border:3px solid transparent;padding:2px}
.icon-grid button.on{border-color:var(--accent)}
.icon-grid .ico{width:100%;height:100%}
.icon-btn{width:54px;height:46px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.empty{text-align:center;color:var(--muted);font-weight:700;padding:30px 10px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
</style>
</head>

(function(){
"use strict";
// ---------- defaults ----------
const DEFAULT_CONFIG = {
  people:[
    {id:"p1",name:"Simon",color:"#4F7CFF"},
    {id:"p2",name:"Dennis",color:"#F0843C"},
    {id:"p3",name:"Max",color:"#1FA371"}

// ---------- dates ----------
const DAY=864e5;
function sod(d){ const x=new Date(d); x.setHours(0,0,0,0); return x; }
function dkey(d){ const x=new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); }
function parseKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function dayDiff(a,b){ return Math.round((sod(b)-sod(a))/DAY); } // b - a in calendar days
function weekStart(d){ const x=sod(d); const wd=(x.getDay()+6)%7; x.setDate(x.getDate()-wd); return x; }
function monthStart(d){ const x=sod(d); x.setDate(1); return x; }
function locale(){ return S.lang==="en"?"en-GB":"de-DE"; }

// ---------- helpers on data ----------
function people(){ return S.config.people||[]; }
function tasks(){ return S.config.tasks||[]; }
function person(id){ return people().find(p=>p.id===id); }
function pname(id){ const p=person(id); return p?p.name:"?"; }
function pcolor(id){ const p=person(id); return p?p.color:"#999"; }
function initials(n){ return (n||"?").trim().charAt(0).toUpperCase(); }
function isAbsent(pid,key){ return S.absences.some(a=>a.person===pid && a.from<=key && key<=a.to); }
function presentDays(pid,from,to){
  let n=0; const end=sod(to); for(let d=sod(from); d<=end; d.setDate(d.getDate()+1)){ if(!isAbsent(pid,dkey(d))) n++; } return n;
}
function totalDays(from,to){ return dayDiff(from,to)+1; }
function periodStart(period){
  const now=new Date();
  if(period==="week") return weekStart(now);
  if(period==="month") return monthStart(now);
  let min=Infinity;
  if(period==="4w"){ for(const e of S.entries) if(e.ts<min) min=e.ts; const f=sod(now); f.setDate(f.getDate()-27); return (min!==Infinity && sod(min)>f)? sod(min) : f; } for(const e of S.entries) if(e.ts<min) min=e.ts;
  return sod(min===Infinity?now:new Date(min));
}
function stats(period){
  const from=periodStart(period), now=new Date(), fromMs=from.getTime();
  const res=people().map(p=>{
    const pts=Math.round(S.entries.filter(e=>e.person===p.id && e.ts>=fromMs).reduce((s,e)=>s+entryPts(e),0)*100)/100;
    const days=presentDays(p.id,from,now), all=totalDays(from,now);
    return {id:p.id,name:p.name,color:p.color,pts,days,away:all-days,rate:days>0?pts/days:null};
  });
  const counted=res.filter(r=>r.rate!=null), sum=counted.reduce((s,r)=>s+r.rate,0);
  res.forEach(r=>{ r.share = r.rate==null?null:(sum>0? r.rate/sum : 1/counted.length); });
  return {from,res,anyPts:res.some(r=>r.pts>0)};
}
// Points always follow the CURRENT task settings, so changing a task's points re-values all its past entries.
// Shared entries (done together) get half. Entries of deleted tasks keep their stored value.
function entryPts(e){ const task=tasks().find(x=>x.id===e.taskId); if(!task) return +e.points||0; const p=+task.points||0; return e.with?p/2:p; }
function shopTask(){ return tasks().find(x=>x.id==="t8") || tasks().find(x=>/einkauf|shopping/i.test(x.name)); }
function openShop(){ return S.shopping.filter(x=>!x.done).sort((a,b)=>a.ts-b.ts); }
function relWhen(ts){ const d=dayDiff(ts,new Date()); return d===0?t("today"):d===1?t("yesterday"):t("daysAgo",{d}); }
const RX=["❤️","🙏"];
function reactionsOf(e){ const r=e.reactions&&typeof e.reactions==="object"?e.reactions:{}; const out=[]; for(const pid in r){ const v=r[pid]; if(v&&RX.includes(v.e)&&person(pid)) out.push({pid,e:v.e,ts:+v.ts||0}); } return out; }
function rxSeenFor(){ const v=+S.rxSeen[S.me]; return v>0?v:Date.now()-14*DAY; }
function newThanks(){ const since=rxSeenFor(), out=[]; for(const e of S.entries){ if(e.person!==S.me) continue; for(const r of reactionsOf(e)) if(r.pid!==S.me && r.ts>since) out.push({entry:e,...r}); } return out.sort((a,b)=>b.ts-a.ts); }
function lastDone(taskId){ let best=null; for(const e of S.entries) if(e.taskId===taskId && (!best||e.ts>best.ts)) best=e; return best; }
function taskStatus(task){
  const last=lastDone(task.id); const freq=Math.max(1,+task.freq||7);
  if(!last) return {last:null,diff:null,status:"soon",ratio:1.2};
  const diff=dayDiff(last.ts,new Date());
  const status = diff>freq ? "over" : (diff>=Math.max(1,Math.ceil(freq*0.8)) ? "soon":"ok");
  return {last,diff,status,ratio:diff/freq,overBy:diff-freq};
}
function lastText(st){
  if(!st.last) return t("never");
  const when = st.diff===0?t("today"):st.diff===1?t("yesterday"):t("daysAgo",{d:st.diff});
  return when+" · "+t("by",{n:pname(st.last.person)});
}
function nextUp(){
  const todayKey=dkey(new Date());
  const st=stats("4w").res.filter(r=>!isAbsent(r.id,todayKey) && r.rate!=null);
  if(!st.length) return null;
  const monthPts={}; const ms=weekStart(new Date()).getTime();
  S.entries.forEach(e=>{ if(e.ts>=ms) monthPts[e.person]=(monthPts[e.person]||0)+entryPts(e); });
  st.sort((a,b)=> a.rate-b.rate || (monthPts[a.id]||0)-(monthPts[b.id]||0) || people().findIndex(p=>p.id===a.id)-people().findIndex(p=>p.id===b.id));
  return st[0];
}
function suggestTasks(pid){
  const n=Math.max(1,people().length), since=Date.now()-30*DAY;
  return tasks().map(task=>{
    const s=taskStatus(task);
    const recent=S.entries.filter(e=>e.taskId===task.id && e.ts>=since);
    const mine=recent.filter(e=>e.person===pid).length;
    const share=recent.length?mine/recent.length:0;
    const rarity=recent.length>=2?Math.max(0,(1/n-share)*n):0;
    const score=Math.min(s.ratio,3)+rarity*0.9;
    let reason;
    if(s.status==="over") reason=t("dueSince",{d:s.overBy,dd:s.overBy===1?t("day1"):t("dayN")});
    else if(rarity>0.5) reason= pid===S.me?t("rarely"):t("rarelyOther",{n:pname(pid)});
    else if(!s.last) reason=t("never");
    else reason=t("dueToday");
    return {task,score,reason};
  }).sort((a,b)=>b.score-a.score).slice(0,2);
}

const $app=document.getElementById("app"), $nav=document.getElementById("nav");

  $nav.hidden=false; renderNav();
  let html=banners();
  if(S.tab==="home") html+=viewHome();
  else if(S.tab==="stats") html+=viewStats();
  else if(S.tab==="shop") html+=viewShop();

  if(keepShop){ const inp=document.getElementById("shopIn"); if(inp){ inp.focus({preventScroll:true}); try{ inp.setSelectionRange(keepShop[0],keepShop[1]); }catch(e){} } }
  if(S.sheet) renderSheet();
}

function viewHome(){
  const me=person(S.me);
  let h=`<header class="top"><div><div class="hello">${esc(t("hi",{n:me.name}))}</div><div class="sub">${esc(t("homeSub"))}</div></div>
  <button type="button" class="me-chip" data-tab="more" aria-label="${esc(t("switchPerson"))}">${avatar(S.me)}<span>${esc(me.name)}</span></button></header>`;
  // thanks received
  const th=newThanks();
  if(th.length){
    h+=`<section class="card thanks-card"><div class="h3">${esc(t("gotThanks"))}</div><ul>${th.slice(0,4).map(x=>{ const task=tasks().find(k=>k.id===x.entry.taskId); return `<li>${esc(t("rxLine",{e:x.e,n:pname(x.pid),t:task?task.name:x.entry.taskName||"?"}))} <span class="muted">· ${esc(relWhen(x.ts))}</span></li>`; }).join("")}${th.length>4?`<li class="muted">${esc(t("rxMore",{c:th.length-4}))}</li>`:""}</ul>
      <div style="margin-top:10px"><button type="button" class="btn small" data-rx-ok="${th[0].ts}">${esc(t("rxOk"))}</button></div></section>`;
    const key=th.map(x=>x.entry.id+x.pid+x.ts).join("|");
    if(!S.rxCelebrated[key]){ S.rxCelebrated[key]=1; setTimeout(()=>celebrate(innerWidth/2,innerHeight*0.25,["#FF7AA2","#FF9DB5","#FFC93C","#E0614B"],50),250); }
  }
  // next up
  const nx=nextUp();
  if(nx){
    const sug=suggestTasks(nx.id);
    const isMe=nx.id===S.me;
    h+=`<section class="card next"><span class="stripe" style="background:${esc(nx.color)}"></span>
      <div class="label">${esc(t("nextUp"))}</div>
      <div class="who">${avatar(nx.id,34)}${esc(nx.name)}${isMe?" 🙌":""}</div>
      <div class="sub" style="margin-bottom:8px">${esc(t("nextHint"))}</div>
      <div class="sugg">${sug.map(s=>`<button type="button" ${isMe&&S.canWrite?`data-log="${esc(s.task.id)}"`:"disabled"}>${iconHTML(s.task.icon,"sm",s.task&&lastDone(s.task.id)?pcolor(lastDone(s.task.id).person):null)}<span>${esc(s.task.name)}<small>${esc(s.reason)} · +${fmtPts(s.task.points)}</small></span></button>`).join("")}</div>
      ${weekStrip()}
    </section>`;
  } else h+=`<section class="card">${esc(t("nobody"))}</section>`;
  // tiles, sorted: due first (most urgent on top), then done

  };
  if(due.length) h+=`<div class="h2">${esc(t("dueGroup"))}</div><div class="hint">${esc(t("longPressHint"))}${S.isAdmin?" "+esc(t("adminLongPress")):""}</div><div class="grid">${due.map(tile).join("")}</div>`;

  h+=`</div>`;

}

// ---------- celebration effects ----------
const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const $fx=document.getElementById("fx"); let fxParts=[], fxRun=false;
function celebrate(x,y,colors,count){
  if(reduceMotion) return;
  const dpr=window.devicePixelRatio||1; if($fx.width!==innerWidth*dpr||$fx.height!==innerHeight*dpr){ $fx.width=innerWidth*dpr; $fx.height=innerHeight*dpr; }
  const shapes=["rect","rect","circle","star"];
  for(let i=0;i<count;i++){
    const a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.1, v=6+Math.random()*9;
    fxParts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.32+Math.random()*.12,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,
      w:6+Math.random()*6,h:4+Math.random()*5,c:colors[i%colors.length],s:shapes[i%shapes.length],life:0,max:70+Math.random()*40});
  }
  if(!fxRun){ fxRun=true; requestAnimationFrame(fxTick); }
}
function fxTick(){
  const ctx=$fx.getContext("2d"), dpr=window.devicePixelRatio||1;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,innerWidth,innerHeight);
  fxParts=fxParts.filter(p=>p.life<p.max && p.y<innerHeight+40);
  for(const p of fxParts){
    p.life++; p.vy+=p.g; p.vx*=.985; p.vy*=.985; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
    ctx.save(); ctx.globalAlpha=Math.max(0,1-p.life/p.max); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    if(p.s==="circle"){ ctx.beginPath(); ctx.arc(0,0,p.w/2.2,0,6.28); ctx.fill(); }
    else if(p.s==="star"){ ctx.font=(p.w*2)+"px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("✦",0,0); }
    else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  }
  if(fxParts.length) requestAnimationFrame(fxTick); else { fxRun=false; ctx.clearRect(0,0,innerWidth,innerHeight); }
}
function floatText(x,y,text,color){
  if(reduceMotion) return;
  const el=document.createElement("div"); el.className="float-pts"; el.textContent=text; el.style.left=x+"px"; el.style.top=y+"px"; el.style.color=color;

function effectsFor(task,opts,each,wasOver){

  const n=pname(S.me), p=fmtPts(each), L=STR[S.lang]||STR.de;
  if(partner) return t("thanksTogether",{a:n,b:pname(partner),p});
  if(wasOver){ const m=L.rescue[Math.floor(Math.random()*L.rescue.length)]; return m.replace("{t}",task.name).replace("{n}",n).replace("{p}",p); }
  const todayStart=sod(new Date()).getTime();
  if(!S.entries.some(e=>e.person===S.me&&e.ts>=todayStart)) return t("firstToday",{n,p});
  const m=L.thanks[Math.floor(Math.random()*L.thanks.length)]; return m.replace("{n}",n).replace("{p}",p);
}
function maybeFairCheer(before){
  const after=(stats("4w").res.find(r=>r.id===S.me)||{}).share, n=Math.max(1,people().length);
  return before!=null && after!=null && before<(1/n)-0.03 && after>=(1/n)-0.03;
}

let logLock={};
function recentDup(taskId){
  const lim=Date.now()-2*3600e3; let best=null;
  for(const e of S.entries) if(e.taskId===taskId && e.ts>=lim && !e.late && (!best||e.ts>best.ts)) best=e;
  return best;
}
// opts: {dayOffset, partner, force}
async function logTask(taskId,opts){
  opts=opts||{}; const task=tasks().find(x=>x.id===taskId); if(!task||!S.canWrite) return;
  const who=(S.isAdmin && opts.forPerson && person(opts.forPerson)) ? opts.forPerson : S.me;
  const day=+opts.dayOffset||0, partner=opts.partner&&person(opts.partner)&&opts.partner!==who?opts.partner:null;
  if(!opts.force && day===0){ const d=recentDup(taskId); if(d){ S.sheet={type:"dup",taskId,opts,last:d}; renderSheet(); return; } }
  if(logLock[taskId]) return; logLock[taskId]=true; setTimeout(()=>{ delete logLock[taskId]; },900);
  S.tileLockUntil=Date.now()+700;
  const now=Date.now(), ts=now-day*DAY, pts=+task.points||0, each=partner?pts/2:pts;
  const base={taskId:task.id,taskName:String(task.name).slice(0,80),icon:String(task.icon).slice(0,20),points:each,ts};
  if(day>0) base.late=true;
  if(who!==S.me) base.loggedBy=S.me;
  const list=[Object.assign({},base,{person:who})];
  if(partner){ const g="g"+now.toString(36)+Math.random().toString(36).slice(2,6); list[0].with=partner; list[0].group=g; list.push(Object.assign({},base,{person:partner,with:who,group:g})); }
  const wasOver=day===0 && taskStatus(task).status==="over";
  const shareBefore=(stats("4w").res.find(r=>r.id===S.me)||{}).share;
  let msg = who!==S.me ? (partner?t("loggedForTogether",{a:pname(who),b:pname(partner),p:fmtPts(each)}):t("loggedFor",{n:pname(who),p:fmtPts(each)})) : cheerMessage(task,each,wasOver,partner);
  effectsFor(task,Object.assign({},opts,{partner,who}),each,wasOver);
  setTimeout(()=>{ if(who===S.me && !partner && !wasOver && maybeFairCheer(shareBefore)){ $toast.querySelector(".msg").textContent=t("fairNow",{n:pname(S.me),p:fmtPts(each)}); } },400);
  if(!S.db){
    list.forEach(x=>{ x.id="local-"+Math.random().toString(36).slice(2); S.entries.push(x); }); render();
    const ids=list.map(x=>x.id);
    toast(msg,async()=>{ S.entries=S.entries.filter(x=>!ids.includes(x.id)); render(); });
    return;
  }
  const refs=list.map(()=>S.db.collection("entries").doc());
  toast(msg,async()=>{ try{ for(const r of refs) await withRetry(()=>r.delete()); }catch(e){ handleWriteError(e); } });
  try{ for(let i=0;i<list.length;i++){ if(S.uid) list[i].uid=S.uid; await withRetry(()=>refs[i].set(list[i])); } }
  catch(e){ $toast.classList.remove("show"); handleWriteError(e); }
}

async function shopBuy(id,el){
  const it=S.shopping.find(z=>z.id===id); if(!it||it.done||!S.canWrite) return;

  else { const [x,y]=originOf(el); celebrate(x,y,[pcolor(S.me),"#FFC93C","#5CC2A7"],18); toast(t("checked",{x:it.name}),async()=>{ await shopSet(id,{done:false}); }); }

// ---------- db connection ----------
function validEntry(d){ return d && typeof d.ts==="number" && typeof d.person==="string" && typeof d.taskId==="string"; }
function validAbs(d){ return d && typeof d.person==="string" && /^\d{4}-\d{2}-\d{2}$/.test(d.from) && /^\d{4}-\d{2}-\d{2}$/.test(d.to); }
function validConfig(d){ return d && Array.isArray(d.people) && d.people.length && Array.isArray(d.tasks); }
async function connect(){
  const db = window.__fbdb!==undefined ? window.__fbdb : await new Promise(res=>{ const t=setTimeout(()=>res(null),10000); window.addEventListener("fbready",()=>{ clearTimeout(t); res(window.__fbdb); },{once:true}); });
  if(!db){ S.mode="preview"; render(); return; }
  S.db=db; S.mode="connecting"; render();
  db.doc("config/admin").onSnapshot(snap=>{ const d=snap.exists?snap.data():null; S.adminHash=d&&typeof d.pinHash==="string"?d.pinHash:null; S.isAdmin=!!S.adminHash && LS.get("adminHash")===S.adminHash; render(); },()=>{});
  const slowTimer=setTimeout(()=>{ S.slow=true; render(); },10000);
  const done=(k,snap)=>{ S.loaded[k]=true; if(snap&&snap.metadata&&!snap.metadata.fromCache){ /* confirmed */ }
    if(S.loaded.config&&S.loaded.entries&&S.loaded.absences&&S.loaded.shopping){ clearTimeout(slowTimer); S.slow=false; S.mode="live"; } };
  const onErr=k=>e=>{ console.warn(k,e); done(k); clearTimeout(slowTimer); if(e&&e.code!=="revoked"){ S.slow=true; } render(); };
  db.doc("config/main").onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;
    S.config = validConfig(d)? clone(d) : clone(DEFAULT_CONFIG);
    if(!snap.metadata.fromCache || snap.exists) done("config",snap);
    render();
  },onErr("config"));
  db.collection("entries").onSnapshot(snap=>{
    S.entries=snap.docs.map(x=>{ const d=x.data(); return validEntry(d)?Object.assign({id:x.id},d):null; }).filter(Boolean);
    done("entries",snap); render();
  },onErr("entries"));
  db.collection("absences").onSnapshot(snap=>{
    S.absences=snap.docs.map(x=>{ const d=x.data(); return validAbs(d)?Object.assign({id:x.id},d):null; }).filter(Boolean);
    done("absences",snap); render();
  },onErr("absences"));
  db.collection("shopping").onSnapshot(snap=>{
    S.shopping=snap.docs.map(x=>{ const d=x.data(); return d&&typeof d.name==="string"&&typeof d.ts==="number"?Object.assign({id:x.id},d):null; }).filter(Boolean);
    done("shopping",snap); render();
  },onErr("shopping"));
  // per-person prefs (backup to localStorage)
  if(S.uid){
    try{ const p=await db.doc("data/users/"+S.uid+"/prefs").get();
      if(p.exists){ const d=p.data()||{}; let ch=false;
        if(!S.me && typeof d.me==="string" && d.me){ S.me=d.me; LS.set("me",d.me); ch=true; }
        if(!LS.get("lang") && (d.lang==="de"||d.lang==="en")){ S.lang=d.lang; ch=true; }
        if(!LS.get("theme") && ["auto","light","dark"].includes(d.theme)){ S.theme=d.theme; ch=true; }
        if(d.rxSeen && typeof d.rxSeen==="object"){ for(const k in d.rxSeen){ const v=+d.rxSeen[k]; if(v>(+S.rxSeen[k]||0)){ S.rxSeen[k]=v; ch=true; } } }
        if(ch) render(); }
    }catch(e){}
  }
}
render();
connect();
})();
</script>
</body>
</html>
